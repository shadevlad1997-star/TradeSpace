limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=refresh_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=merchant_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=aggregator_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=callback_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cabinet_limit:10m rate=8r/s;

upstream processing_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    autoindex off;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;
    autoindex off;

    # When Cloudflare or another trusted proxy is enabled, configure real_ip
    # from the provider IP ranges in the outer server template.

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 10m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /metrics {
        return 404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.(?:env|git|svn|hg|bak|backup|dump|sql|sqlite|sqlite3|db|pem|key|p12|pfx)$ {
        return 404;
    }

    location ^~ /uploads/ {
        return 404;
    }

    location ~ ^/(health|ready)$ {
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/(login|api/v1/auth/login)$ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=refresh_limit burst=20 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /api/v1/merchant/ {
        limit_req zone=merchant_limit burst=100 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /api/v1/aggregator/ {
        limit_req zone=aggregator_limit burst=100 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/v1/(callback|callbacks|webhook|webhooks) {
        limit_req zone=callback_limit burst=100 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /api/v1/admin/ {
        limit_req zone=cabinet_limit burst=60 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /cabinet {
        limit_req zone=cabinet_limit burst=60 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://processing_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
