[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "processing-platform"
version = "2.0.0rc2"
description = "Production-ready FastAPI TradeSpace platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "starlette==1.3.1",
  "uvicorn[standard]==0.51.0",
  "sqlalchemy==2.0.51",
  "asyncpg==0.31.0",
  "alembic==1.18.5",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT==2.13.0",
  "argon2-cffi==25.1.0",
  "pyotp==2.9.0",
  "qrcode[pil]==8.0",
  "redis==6.4.0",
  "celery==5.6.3",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "cryptography==50.0.0",
  "orjson==3.11.6",
  "slowapi==0.1.9",
  "itsdangerous==2.2.0",
  "psycopg==3.3.4",
  "pytest==9.0.3"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "scripts", "scripts.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/**/*.html", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
